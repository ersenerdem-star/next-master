[build]
  command = "npm run build"
  publish = "apps/web/dist"

[context.production]
  command = "npm run build"
  publish = "apps/web/dist"

  [context.production.environment]
    VITE_DEPLOY_CONTEXT = "production"

[context.branch-deploy]
  command = "npm run build"
  publish = "apps/web/dist"

  [context.branch-deploy.environment]
    VITE_DEPLOY_CONTEXT = "branch-deploy"

[context.deploy-preview]
  command = "npm run build"
  publish = "apps/web/dist"

  [context.deploy-preview.environment]
    VITE_DEPLOY_CONTEXT = "deploy-preview"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."portal-export-worker-background"]
  # Large V3 exports must run as a Netlify Background Function.  Without this
  # flag the first invocation is subject to the synchronous function timeout
  # and can stop after a few snapshot pages, leaving the job waiting for a
  # browser status poll to restart it.
  background = true
  external_node_modules = ["@duckdb/node-api", "@duckdb/node-bindings", "@duckdb/node-bindings-linux-x64"]
  included_files = ["node_modules/@duckdb/node-bindings-linux-x64/**", "!node_modules/@duckdb/node-bindings-darwin-arm64/**"]

[functions."admin-export-background"]
  background = true
  memory = "2gb"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Service-Worker-Allowed = "/"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/portal*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/api/catalog/observation-review/apply"
  to = "/.netlify/functions/catalog-observation-review-apply"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
