services:
  - type: worker
    name: next-master-catalog-import-staging
    runtime: docker
    dockerfilePath: ./apps/engine/catalog-import/Dockerfile
    dockerContext: .
    branch: codex/price-engine-integration
    autoDeploy: false
    envVars:
      - key: NM_FULL_STAGING_TARGET
        value: kaxsqafdevabkxofwdod
      - key: SUPABASE_URL
