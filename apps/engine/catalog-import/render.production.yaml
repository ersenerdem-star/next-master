# Production preparation only. No resource has been created or purchased.
# Replace the branch with the reviewed production release branch before Apply.
# Activating import requires both explicit flags and the dedicated DBOS history.
previews:
  generation: off

services:
  - type: worker
    name: next-master-catalog-import-production
    runtime: docker
    plan: 1c-2g
    region: frankfurt
    repo: https://github.com/ersenerdem-star/next-master
    branch: codex/price-engine-integration
    dockerfilePath: ./apps/engine/catalog-import/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    numInstances: 1
    # Stop the prior instance before replacement so the stable DBOS executor
    # never overlaps itself. This unused mount holds no history or source data.
    disk:
      name: production-single-instance-guard
      mountPath: /var/lib/next-master-deployment-guard
      sizeGB: 1
    envVars:
      - key: NM_PRODUCTION_TARGET
        value: zjgueqijumzlfioihnkt
      - key: NM_PRODUCTION_PORTAL_ORIGIN
        value: https://portal.next-master.com
      - key: SUPABASE_URL
        value: https://zjgueqijumzlfioihnkt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DBOS_SYSTEM_DATABASE_URL
        fromDatabase:
          name: next-master-catalog-import-production-history
          property: connectionString
      - key: CATALOG_IMPORT_WORKER_ID
        value: catalog-import-production-01
      # Supply "0" during provisioning and "1" only at reviewed activation.
      # Keep operator-owned values across later Blueprint synchronizations.
      - key: CATALOG_IMPORT_SERVICE_ENABLED
        sync: false
      - key: CATALOG_STORAGE_IMPORT_PRODUCTION_ENABLED
        sync: false
      - key: CATALOG_IMPORT_SERVICE_HISTORY_CONFIRMED
        sync: false

databases:
  - name: next-master-catalog-import-production-history
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: nm_catalog_production_history
    user: nm_catalog_production_worker
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []
